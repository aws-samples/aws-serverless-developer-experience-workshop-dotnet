name: Unicorn Properties Terraform Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment stage; ignored by account-global Shared targets
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      deployment_target:
        description: Deploy one root at a time in the listed dependency order
        required: true
        default: contracts-domain
        type: choice
        options:
          - shared-namespaces
          - shared-images
          - contracts-domain
          - approvals-domain
          - web-domain
          - contracts-schema
          - approvals-schema
          - web-schema
          - contracts-service
          - approvals-service
          - web-service
          - approvals-contracts-subscriptions
          - approvals-web-subscriptions
          - web-approvals-subscriptions
          - shared-api-gateway-account
      region:
        description: AWS region
        required: true
        default: ap-southeast-2
        type: string
      terraform_state_bucket:
        description: Pre-provisioned Terraform state bucket accessible to the runner role
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate solution and Terraform roots
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      DOTNET_VERSION: "10.0.x"
    steps:
      - uses: actions/checkout@v5

      # This general runner must not expose AWS deployment credentials. Native
      # SAM Terraform-hook builds are intentionally absent from PR validation.
      - name: Configure .NET, Python, AWS SAM, and validation tools
        uses: ./.gitea/actions/configure

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Test solution
        run: dotnet test UnicornProperties.sln --configuration Release

      - name: Validate all 15 Terraform roots with backends disabled
        run: python3 scripts/validate_infrastructure.py

  deployment_plan:
    name: Plan manual deployment
    if: ${{ gitea.event_name == 'workflow_dispatch' }}
    needs: validate
    # Register a dedicated runner with read/plan-only, stage-scoped AWS access.
    # It must not be available to push or pull-request validation jobs.
    runs-on: [self-hosted, deployment-plan]
    env:
      PYTHON_VERSION: "3.12"
      DOTNET_VERSION: "10.0.x"
      TF_IN_AUTOMATION: "true"
      STAGE: ${{ inputs.stage }}
      DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
      REGION: ${{ inputs.region }}
      TERRAFORM_STATE_BUCKET: ${{ inputs.terraform_state_bucket }}
    steps:
      - uses: actions/checkout@v5

      # The runner supplies least-privilege credentials. Terraform initialization,
      # data sources, and native SAM Terraform-hook builds read AWS SSM parameters.
      - name: Configure .NET, Python, AWS CLI, and AWS SAM
        uses: ./.gitea/actions/configure

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Plan selected Terraform root
        shell: bash
        run: |
          set -euo pipefail
          make_target() {
            # Skip the Makefile's backend bootstrap recipe. CI requires a
            # pre-provisioned state backend and fails closed when it is absent.
            make -C "$1" -o ensure-state-backend "$2" \
              STAGE="$STAGE" \
              REGION="$REGION" \
              TERRAFORM_STATE_BUCKET="$TERRAFORM_STATE_BUCKET"
          }

          case "$DEPLOYMENT_TARGET" in
            shared-namespaces)
              make_target Unicorn.Shared plan-namespaces
              ;;
            shared-images)
              # Plan only the selected stage; never fan out across image stages.
              make_target Unicorn.Shared "plan-images-$STAGE"
              ;;
            contracts-domain)
              make_target Unicorn.Contracts plan-domain
              ;;
            approvals-domain)
              make_target Unicorn.Approvals plan-domain
              ;;
            web-domain)
              make_target Unicorn.Web plan-domain
              ;;
            contracts-schema)
              make_target Unicorn.Contracts plan-schema
              ;;
            approvals-schema)
              make_target Unicorn.Approvals plan-schema
              ;;
            web-schema)
              make_target Unicorn.Web plan-schema
              ;;
            contracts-service)
              # Packages the deterministic Contracts ZIP before planning it.
              make_target Unicorn.Contracts plan-service
              ;;
            approvals-service)
              # Packages the deterministic Approvals ZIP before planning it.
              make_target Unicorn.Approvals plan-service
              ;;
            web-service)
              # Packages the deterministic Web ZIPs before planning them.
              make_target Unicorn.Web plan-service
              ;;
            approvals-contracts-subscriptions)
              make_target Unicorn.Approvals plan-sub-contracts
              ;;
            approvals-web-subscriptions)
              make_target Unicorn.Approvals plan-sub-web
              ;;
            web-approvals-subscriptions)
              make_target Unicorn.Web plan-sub-approvals
              ;;
            shared-api-gateway-account)
              make_target Unicorn.Shared plan-api-gateway-account
              ;;
            *)
              echo "Unsupported deployment target: $DEPLOYMENT_TARGET" >&2
              exit 1
              ;;
          esac

      - name: Upload saved production plan and deployment packages
        if: ${{ inputs.stage == 'prod' && inputs.deployment_target != 'shared-namespaces' && inputs.deployment_target != 'shared-api-gateway-account' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-${{ inputs.deployment_target }}-plan
          path: |
            Unicorn.*/Infrastructure/**/.terraform/prod.tfplan
            Unicorn.*/Infrastructure/*-service/.terraform/*.zip
          if-no-files-found: error
          include-hidden-files: true

  deploy_dev:
    name: Apply manual development deployment
    if: ${{ gitea.event_name == 'workflow_dispatch' && inputs.stage == 'dev' && inputs.deployment_target != 'shared-namespaces' && inputs.deployment_target != 'shared-api-gateway-account' }}
    needs: deployment_plan
    # Register this runner with only development apply permissions.
    runs-on: [self-hosted, deployment-dev]
    environment:
      name: development
    env:
      PYTHON_VERSION: "3.12"
      DOTNET_VERSION: "10.0.x"
      TF_IN_AUTOMATION: "true"
      STAGE: dev
      DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
      REGION: ${{ inputs.region }}
      TERRAFORM_STATE_BUCKET: ${{ inputs.terraform_state_bucket }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure .NET, Python, AWS CLI, and AWS SAM
        uses: ./.gitea/actions/configure

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Apply selected development root
        shell: bash
        run: |
          set -euo pipefail
          make_target() {
            make -C "$1" -o ensure-state-backend "$2" \
              STAGE="$STAGE" \
              REGION="$REGION" \
              TERRAFORM_STATE_BUCKET="$TERRAFORM_STATE_BUCKET"
          }

          case "$DEPLOYMENT_TARGET" in
            shared-images)
              make_target Unicorn.Shared deploy-images-dev
              ;;
            contracts-domain)
              make_target Unicorn.Contracts deploy-domain
              ;;
            approvals-domain)
              make_target Unicorn.Approvals deploy-domain
              ;;
            web-domain)
              make_target Unicorn.Web deploy-domain
              ;;
            contracts-schema)
              make_target Unicorn.Contracts deploy-schema
              ;;
            approvals-schema)
              make_target Unicorn.Approvals deploy-schema
              ;;
            web-schema)
              make_target Unicorn.Web deploy-schema
              ;;
            contracts-service)
              make_target Unicorn.Contracts deploy-service
              ;;
            approvals-service)
              make_target Unicorn.Approvals deploy-service
              ;;
            web-service)
              make_target Unicorn.Web deploy-service
              ;;
            approvals-contracts-subscriptions)
              make_target Unicorn.Approvals deploy-contracts-subscriptions
              ;;
            approvals-web-subscriptions)
              make_target Unicorn.Approvals deploy-web-subscriptions
              ;;
            web-approvals-subscriptions)
              make_target Unicorn.Web deploy-subscriptions
              ;;
            *)
              echo "Unsupported development deployment target: $DEPLOYMENT_TARGET" >&2
              exit 1
              ;;
          esac

  deploy_prod:
    name: Apply approved production saved plan
    if: ${{ gitea.event_name == 'workflow_dispatch' && inputs.stage == 'prod' && inputs.deployment_target != 'shared-namespaces' && inputs.deployment_target != 'shared-api-gateway-account' }}
    needs: deployment_plan
    # Register this runner with only production apply permissions.
    runs-on: [self-hosted, deployment-prod]
    environment:
      # Configure this protected environment to require human approval.
      name: production
    env:
      PYTHON_VERSION: "3.12"
      DOTNET_VERSION: "10.0.x"
      TF_IN_AUTOMATION: "true"
      STAGE: prod
      DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
      REGION: ${{ inputs.region }}
      TERRAFORM_STATE_BUCKET: ${{ inputs.terraform_state_bucket }}
      CONFIRM_PROD: APPLY
    steps:
      - uses: actions/checkout@v5

      - name: Download reviewed production plan
        uses: actions/download-artifact@v4
        with:
          name: production-${{ inputs.deployment_target }}-plan
          path: .

      - name: Configure .NET, Python, AWS CLI, and AWS SAM
        uses: ./.gitea/actions/configure

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Apply selected production saved plan
        shell: bash
        run: |
          set -euo pipefail
          make_target() {
            make -C "$1" -o ensure-state-backend "$2" \
              STAGE="$STAGE" \
              REGION="$REGION" \
              TERRAFORM_STATE_BUCKET="$TERRAFORM_STATE_BUCKET" \
              CONFIRM_PROD="$CONFIRM_PROD"
          }

          case "$DEPLOYMENT_TARGET" in
            shared-images)
              make_target Unicorn.Shared deploy-images-prod
              ;;
            contracts-domain)
              make_target Unicorn.Contracts deploy-domain
              ;;
            approvals-domain)
              make_target Unicorn.Approvals deploy-domain
              ;;
            web-domain)
              make_target Unicorn.Web deploy-domain
              ;;
            contracts-schema)
              make_target Unicorn.Contracts deploy-schema
              ;;
            approvals-schema)
              make_target Unicorn.Approvals deploy-schema
              ;;
            web-schema)
              make_target Unicorn.Web deploy-schema
              ;;
            contracts-service)
              make_target Unicorn.Contracts deploy-service
              ;;
            approvals-service)
              make_target Unicorn.Approvals deploy-service
              ;;
            web-service)
              make_target Unicorn.Web deploy-service
              ;;
            approvals-contracts-subscriptions)
              make_target Unicorn.Approvals deploy-contracts-subscriptions
              ;;
            approvals-web-subscriptions)
              make_target Unicorn.Approvals deploy-web-subscriptions
              ;;
            web-approvals-subscriptions)
              make_target Unicorn.Web deploy-subscriptions
              ;;
            *)
              echo "Unsupported production deployment target: $DEPLOYMENT_TARGET" >&2
              exit 1
              ;;
          esac

  deploy_account_global:
    name: Apply explicit account-global Shared target
    if: ${{ gitea.event_name == 'workflow_dispatch' && (inputs.deployment_target == 'shared-namespaces' || inputs.deployment_target == 'shared-api-gateway-account') }}
    needs: deployment_plan
    # Register this runner with narrowly scoped account-global permissions.
    runs-on: [self-hosted, deployment-account-global]
    environment:
      # Account-global changes are isolated from stage deployments and should
      # use a separately protected environment approval.
      name: account-global
    env:
      PYTHON_VERSION: "3.12"
      DOTNET_VERSION: "10.0.x"
      TF_IN_AUTOMATION: "true"
      DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
      REGION: ${{ inputs.region }}
      TERRAFORM_STATE_BUCKET: ${{ inputs.terraform_state_bucket }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure .NET, Python, AWS CLI, and AWS SAM
        uses: ./.gitea/actions/configure

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Apply selected account-global root
        shell: bash
        run: |
          set -euo pipefail
          make_target() {
            make -C "$1" -o ensure-state-backend "$2" \
              REGION="$REGION" \
              TERRAFORM_STATE_BUCKET="$TERRAFORM_STATE_BUCKET"
          }

          case "$DEPLOYMENT_TARGET" in
            shared-namespaces)
              make_target Unicorn.Shared deploy-namespaces
              ;;
            shared-api-gateway-account)
              make_target Unicorn.Shared deploy-api-gateway-account
              ;;
            *)
              echo "Unsupported account-global target: $DEPLOYMENT_TARGET" >&2
              exit 1
              ;;
          esac
